<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <title>Мессенджер</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  body { height: 100vh; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; }
  .auth, .app { width: 100%; max-width: 900px; height: 90vh; background: #1e293b; border-radius: 12px; overflow: hidden; display: flex; }
  .auth { max-width: 400px; flex-direction: column; padding: 30px; justify-content: center; }
  .auth h1 { margin-bottom: 20px; text-align: center; }
  .auth input { width: 100%; padding: 12px; margin: 6px 0; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; }
  .auth button { width: 100%; padding: 12px; margin-top: 10px; background: #3b82f6; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; }
  .auth button:hover { background: #2563eb; }
  .auth .switch { margin-top: 15px; text-align: center; color: #94a3b8; }
  .auth .switch a { color: #60a5fa; cursor: pointer; }
  .err { color: #f87171; font-size: 14px; margin: 8px 0; min-height: 18px; }
  .sidebar { width: 280px; border-right: 1px solid #334155; display: flex; flex-direction: column; }
  .me { padding: 15px; border-bottom: 1px solid #334155; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .me button { background: none; border: none; color: #94a3b8; cursor: pointer; }
  .users { flex: 1; overflow-y: auto; }
  .user { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 10px; }
  .user:hover { background: #334155; }
  .user.active { background: #334155; }
  .dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; }
  .chat { flex: 1; display: flex; flex-direction: column; }
  .chat-head { padding: 15px; border-bottom: 1px solid #334155; font-weight: 600; }
  .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; word-wrap: break-word; }
  .msg.in { background: #334155; align-self: flex-start; }
  .msg.out { background: #3b82f6; align-self: flex-end; }
  .msg .time { font-size: 11px; opacity: 0.6; margin-top: 4px; }
  .input-area { padding: 12px; border-top: 1px solid #334155; display: flex; gap: 8px; }
  .input-area input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; }
  .input-area button { padding: 10px 18px; background: #3b82f6; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #64748b; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Экран авторизации -->
<div class="auth" id="authScreen">
  <h1 id="authTitle">Вход</h1>
  <input type="text" id="username" placeholder="Имя" class="hidden">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Пароль">
  <div class="err" id="authErr"></div>
  <button onclick="submitAuth()" id="authBtn">Войти</button>
  <div class="switch">
    <span id="switchText">Нет аккаунта?</span>
    <a onclick="toggleMode()" id="switchLink">Зарегистрироваться</a>
  </div>
</div>

<!-- Основное приложение -->
<div class="app hidden" id="app">
  <div class="sidebar">
    <div class="me">
      <span id="meName"></span>
      <button onclick="logout()">Выйти</button>
    </div>
    <div class="users" id="usersList"></div>
  </div>
  <div class="chat">
    <div class="chat-head" id="chatHead">Выбери собеседника</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
let me = null;
let currentPeer = null;
let onlineList = [];
let isRegister = false;

function toggleMode() {
  isRegister = !isRegister;
  document.getElementById('authTitle').textContent = isRegister ? 'Регистрация' : 'Вход';
  document.getElementById('username').classList.toggle('hidden', !isRegister);
  document.getElementById('authBtn').textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
  document.getElementById('switchText').textContent = isRegister ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
  document.getElementById('switchLink').textContent = isRegister ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('authErr').textContent = '';
}

async function submitAuth() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const username = document.getElementById('username').value.trim();
  const errEl = document.getElementById('authErr');
  errEl.textContent = '';

  const url = isRegister ? '/api/register' : '/api/login';
  const body = isRegister ? { email, password, username } : { email, password };

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error; return; }
    me = data;
    localStorage.setItem('user', JSON.stringify(me));
    startApp();
  } catch (e) {
    errEl.textContent = 'Ошибка соединения';
  }
}

function logout() {
  localStorage.removeItem('user');
  location.reload();
}

function startApp() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('meName').textContent = me.username + ' (' + me.email + ')';

  socket = io();
  socket.on('connect', () => socket.emit('auth', me));
  socket.on('online', (list) => {
    onlineList = list;
    renderUsers();
  });
  socket.on('message', (msg) => {
    // Если сообщение от текущего собеседника или от меня к нему
    if ((msg.from.id === currentPeer && msg.toId === me.id) ||
        (msg.from.id === me.id && msg.toId === currentPeer)) {
      appendMsg(msg);
    }
  });
}

function renderUsers() {
  const list = document.getElementById('usersList');
  if (onlineList.length === 0) {
    list.innerHTML = '<div style="padding:15px;color:#64748b">Никого нет онлайн</div>';
    return;
  }
  list.innerHTML = onlineList.map(u => `
    <div class="user ${currentPeer === u.id ? 'active' : ''}" onclick="openChat(${u.id}, '${u.username.replace(/'/g,"\\'")}')">
      <div class="dot"></div>
      <div>${u.username}</div>
    </div>
  `).join('');
}

async function openChat(userId, username) {
  currentPeer = userId;
  document.getElementById('chatHead').textContent = username;
  renderUsers();
  document.getElementById('messages').innerHTML = '<div style="color:#64748b">Загрузка...</div>';

  socket.emit('load history', { withId: userId }, (history) => {
    const box = document.getElementById('messages');
    box.innerHTML = '';
    history.forEach(appendMsg);
    box.scrollTop = box.scrollHeight;
  });
}

function appendMsg(msg) {
  const box = document.getElementById('messages');
  const isMe = msg.from.id === me.id;
  const div = document.createElement('div');
  div.className = 'msg ' + (isMe ? 'out' : 'in');
  const t = new Date(msg.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<div>${escapeHtml(msg.text)}</div><div class="time">${t}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text || !currentPeer) return;
  socket.emit('send message', { toId: currentPeer, text });
  inp.value = '';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Авто-вход
window.addEventListener('load', () => {
  const saved = localStorage.getItem('user');
  if (saved) {
    me = JSON.parse(saved);
    startApp();
  }
});
</script>
 <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
